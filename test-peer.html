<!DOCTYPE html>
<html>
<head>
    <title>PeerJS Test</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <h1>PeerJS Connection Test</h1>
    <div id="status">Testing connection...</div>
    <div id="peerId"></div>
    <script>
        const statusDiv = document.getElementById('status');
        const peerIdDiv = document.getElementById('peerId');

        try {
            const peer = new Peer();

            peer.on('open', (id) => {
                console.log('Peer opened with ID:', id);
                statusDiv.innerHTML = '✅ PeerJS server is working!';
                peerIdDiv.innerHTML = 'Your Peer ID: ' + id;
            });

            peer.on('error', (err) => {
                console.error('Peer error:', err);
                statusDiv.innerHTML = '❌ PeerJS error: ' + err.type + ' - ' + err.message;
            });

            setTimeout(() => {
                if (!peer.id) {
                    statusDiv.innerHTML = '⏱️ Connection timeout - PeerJS server might be slow or down';
                }
            }, 10000);

        } catch (error) {
            console.error('Failed to create peer:', error);
            statusDiv.innerHTML = '❌ Failed to initialize PeerJS: ' + error.message;
        }
    </script>
</body>
</html>
